plugins {
    id "me.shedaniel.unified-publishing" version "0.1.+"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "vrgear.common.mixins.json"
        mixinConfig "vrgear.mixins.json"

        dataGen {
            mod "vrgear"
        }
    }
}

sourceSets.main.java {
    exclude "net/vrgear/client/**"
    exclude "net/vrgear/common/forge/**"
    exclude "net/vrgear/forge/mixin/**"
    exclude "net/vrgear/forge/ClientModBusEvents.java"
    exclude "net/vrgear/forge/handlers/**"
    exclude "net/vrgear/forge/data/**"
    exclude "net/vrgear/registry/**"
}

unifiedPublishing {
    project {
        displayName = "[Forge] - VR Gear - $rootProject.minecraft_version - v$project.version"
        releaseType = "release"
        changelog = new File("${rootProject.projectDir}/changelog.html").text
        gameVersions = ["1.19.2"]
        mainPublication tasks.jar
        gameLoaders = ["forge"]
        relations {

        }

        var CURSE_API_KEY = providers.gradleProperty("curseforge").orNull ?: System.getenv("curseforge")
        if (CURSE_API_KEY != null) {
            curseforge {
                token = CURSE_API_KEY
                id = "697897"
                gameVersions.addAll "Java 17", "1.19.2"
            }
        }

        var MODRINTH_TOKEN = providers.gradleProperty("modrinth").orNull ?: System.getenv("modrinth")
        if (MODRINTH_TOKEN != null) {
            modrinth {
                token = MODRINTH_TOKEN
                id = "OkTHvnQp"
                version = "$project.version+$project.name"
            }
        }
    }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"
    implementation project(":common")
}

processResources {
    inputs.property "version", project.version
    exclude "assets/vrgear/lang/en_us.json"

    filesMatching("META-INF/mods.toml") {
        expand "version": project.version
    }
}

jar {
    duplicatesStrategy = 'include'
    from project(":common").sourceSets.main.output
    archiveClassifier.set("")
}

sourcesJar {
    duplicatesStrategy = 'include'
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

publishing {
    publications {
        mavenForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
